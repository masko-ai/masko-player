name: build

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcjson-dev
      - name: Install numpy
        run: pip install numpy
      - name: Build a pack from a synthetic clip
        run: |
          cd "$GITHUB_WORKSPACE"
          ffmpeg -y -f lavfi -i "testsrc2=s=480x480:d=2:r=24" -c:v libx264 \
                 -pix_fmt yuv420p /tmp/clip.mp4
          tools/masko_pack.py build /tmp/clip.mp4 --crop --size 466 \
                 -o /tmp/clip.mkpk
          tools/masko_pack.py verify /tmp/clip.mkpk
      - name: Run every host test
        run: tools/test_all.sh /tmp/clip.mkpk

  esp-idf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: ["v5.5.5"]
        # 6.0.x is allowed to fail while the API drifts
        # idf: ["v6.0.3"]
    steps:
      - uses: actions/checkout@v4
      # espressif/idf was retired; install-esp-idf-action is the current one.
      - uses: espressif/install-esp-idf-action@v1
        with:
          version: ${{ matrix.idf }}
      - name: Build the example
        run: idf.py -C examples/waveshare_amoled_175 build
