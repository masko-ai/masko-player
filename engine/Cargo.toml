[package]
name = "masko-player-engine"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "The Masko player engine: every canvas rule, no video, no network, no screen."
publish = false

[features]
default = ["std"]
# Without std the engine needs only an allocator: the C library for ESP32
# boards (bindings/c, esp32/masko_engine) builds it that way.
std = ["serde/std", "serde_json/std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
