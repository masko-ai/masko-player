[package]
name = "masko-player-c"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Masko player engine as a C library, for ESP32 boards and other C firmware."
publish = false

[lib]
crate-type = ["staticlib"]

[features]
default = ["std"]
# Without std, for ESP32 firmware: the library takes malloc, free, memalign
# and abort from the firmware's C library (esp32/masko_engine builds it so).
std = ["masko-player-engine/std", "serde_json/std"]

[dependencies]
masko-player-engine = { path = "../../engine", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
