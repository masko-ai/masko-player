# The ESP32 player (esp32/) and the engine for it (bindings/c), on every
# change to them: Marvin Schmid's host tests, the engine compiled for each
# chip (kept as downloads), the firmware examples built with ESP-IDF, and the
# demo built from a compiled engine with no Rust. Board checks stay manual.
name: ESP32

on:
  push:
    branches: [main]
    paths:
      - 'esp32/**'
      - 'bindings/c/**'
      - 'engine/**'
      - '.github/workflows/esp32.yml'
  pull_request:
    paths:
      - 'esp32/**'
      - 'bindings/c/**'
      - 'engine/**'
      - '.github/workflows/esp32.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and cJSON
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcjson-dev
      - name: Install numpy
        run: pip install numpy
      - name: Build a pack from a synthetic clip
        run: |
          ffmpeg -y -f lavfi -i "testsrc2=s=480x480:d=2:r=24" -c:v libx264 \
                 -pix_fmt yuv420p /tmp/clip.mp4
          tools/masko_pack.py build /tmp/clip.mp4 --crop --size 466 \
                 -o /tmp/clip.mkpk
          tools/masko_pack.py verify /tmp/clip.mkpk
      - name: Run every host test
        run: tools/test_all.sh /tmp/clip.mkpk

  # The engine compiled for each chip, without Rust's standard library: the
  # files a firmware uses so it builds without Rust (esp32/masko_engine/lib/).
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chip: esp32s3, target: xtensa-esp32s3-none-elf, xtensa: true }
          - { chip: esp32, target: xtensa-esp32-none-elf, xtensa: true }
          - { chip: esp32s2, target: xtensa-esp32s2-none-elf, xtensa: true }
          - { chip: esp32c3, target: riscv32imc-unknown-none-elf, xtensa: false }
          - { chip: esp32c6, target: riscv32imac-unknown-none-elf, xtensa: false }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.xtensa
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: ${{ matrix.chip }}
          default: false
          override: false
          export: false
      - name: Build for ${{ matrix.chip }}
        run: |
          if [ "${{ matrix.xtensa }}" = "true" ]; then
            cargo +esp build -p masko-player-c --release --no-default-features \
              --target ${{ matrix.target }} -Zbuild-std=core,alloc
          else
            rustup target add ${{ matrix.target }}
            cargo build -p masko-player-c --release --no-default-features \
              --target ${{ matrix.target }}
          fi
          mkdir -p out/lib/${{ matrix.chip }}
          cp target/${{ matrix.target }}/release/libmasko_player_c.a out/lib/${{ matrix.chip }}/
      - uses: actions/upload-artifact@v4
        with:
          name: masko_engine-${{ matrix.chip }}
          path: out/

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [engine_demo, waveshare_amoled_175]
    steps:
      - uses: actions/checkout@v4
      # Only the Rust compiler: ESP-IDF brings the GCC its version expects.
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32s3
          default: false
          override: false
          export: false
      - uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5
      - name: Build ${{ matrix.example }}
        run: idf.py -C esp32/examples/${{ matrix.example }} set-target esp32s3 build

  # What a maker without Rust gets: the demo built from the compiled engine.
  firmware-without-rust:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: masko_engine-esp32s3
          path: esp32/masko_engine/
      - uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5
      - name: Build engine_demo with no Rust installed
        run: |
          set -o pipefail
          idf.py -C esp32/examples/engine_demo set-target esp32s3 build 2>&1 | tee build.log
          grep -q "masko_engine: compiled engine for esp32s3" build.log
          if grep -q "Building the Masko player engine" build.log; then
            echo "::error::the build compiled the engine instead of using the compiled one"
            exit 1
          fi
